# Полный стек в Docker (docker compose up). Запекается в образ nginx
# (docker/nginx/Dockerfile) как /etc/nginx/conf.d/default.conf.
#
#   /api/   → контейнер api (FastAPI), префикс /api срезается
#   /media/ → контейнер minio, бакет videos (HLS)
#   /       → собранная статика Angular, лежит прямо в этом образе
#
# Для разработки с hot reload — nginx.dev.conf + docker-compose.dev.yml.

server {
    listen 80;

    absolute_redirect off;

    root /usr/share/nginx/html;

    location /api/ {
        # api — имя сервиса в docker-compose.yml, DNS сети Docker.
        proxy_pass http://api:8000/;

        client_max_body_size 10m;
        proxy_read_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        proxy_pass http://minio:9000/videos/;
        proxy_set_header Cookie "";
    }

    location / {
        # SPA: файл, если он есть (main-XXXX.js, styles.css), иначе index.html —
        # дальше маршрут (/videos/5, /upload) разбирает роутер Angular.
        try_files $uri $uri/ /index.html;
    }
}

# DEV-режим (docker-compose.dev.yml): FastAPI и ng serve запущены на хосте.
# Монтируется в контейнер как /etc/nginx/conf.d/default.conf.
# Блок http{} уже есть в главном nginx.conf образа, здесь — только наш сайт.
#
# Для браузера всё живёт на одном origin http://localhost:8080:
#   /api/   → FastAPI на хосте (префикс /api срезается)
#   /media/ → MinIO, бакет videos (HLS-плейлисты и сегменты)
#   /       → dev-сервер Angular на хосте

server {
    listen 80;

    # Редиректы (например /api → /api/) без схемы и хоста: иначе nginx подставит
    # свой внутренний порт 80 и отправит браузер на localhost вместо localhost:8080.
    absolute_redirect off;

    location /api/ {
        # Слэш в конце: префикс /api/ заменяется на /, т.е. /api/videos → /videos.
        proxy_pass http://host.docker.internal:8000/;

        # Чанк загрузки — 5 МБ (settings.upload_chunk_size_bytes), дефолт nginx — 1 МБ.
        client_max_body_size 10m;

        # upload/complete синхронно склеивает чанки и заливает файл в MinIO —
        # на больших файлах это дольше дефолтных 60 секунд ожидания ответа.
        proxy_read_timeout 600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        # /media/videos/79/hls/master.m3u8 → minio:9000/videos/videos/79/hls/master.m3u8
        #                                               └бакет┘└──────── ключ ───────┘
        proxy_pass http://minio:9000/videos/;

        # Cookie с access_token браузер шлёт на весь origin; MinIO он ни к чему.
        proxy_set_header Cookie "";
    }

    location / {
        proxy_pass http://host.docker.internal:4200;

        # Dev-сервер пускает только запросы с Host: localhost, а не host.docker.internal.
        proxy_set_header Host $host;

        # Live reload работает через WebSocket: нужен HTTP/1.1 и явная пересылка
        # hop-by-hop заголовков Upgrade/Connection, которые прокси по умолчанию отбрасывает.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
